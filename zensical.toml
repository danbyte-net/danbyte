  ] },
  { "Virtualization" = [
    { "Virtual machines & clusters" = "features/virtualization.md" },
    { "Proxmox VE sync" = "features/virt-proxmox.md" },
    { "VMware vCenter sync" = "features/virt-vcenter.md" },
  ] },
  { "Monitoring & compliance" = [
    "monitoring/index.md",
    { "Monitoring"        = "features/monitoring.md" },
    { "Outposts (remote engines)" = "monitoring/outposts.md" },
    { "SNMP discovery"    = "features/snmp-discovery.md" },
    { "Certificate inventory" = "monitoring/certificates.md" },
    { "SSH host keys"     = "monitoring/ssh-host-keys.md" },
    { "Device access (Connect & terminal)" = "features/device-access.md" },
    { "Compliance"        = "features/compliance.md" },
  ] },
  { "Working with data" = [
    "working-with-data/index.md",
    { "The dashboard"     = "features/dashboard.md" },
    { "Saved views & filters" = "features/saved-views.md" },
    { "Table columns"     = "features/table-preferences.md" },
    { "Exporting tables"  = "features/exporting-tables.md" },
    { "Import & export"   = "features/import-export.md" },
    { "Printing labels"   = "features/label-templates.md" },
    { "Documents"         = "features/documents.md" },
    { "Journals"          = "features/journals.md" },
    { "Change log"        = "features/change-log.md" },
    { "Object numbers (IDs)" = "features/object-numbers.md" },
    { "Background jobs"   = "features/jobs.md" },
  ] },
  { "Customization" = [
    { "Statuses & roles"  = "features/catalogs-and-settings.md" },
    { "Tags & custom fields" = "features/tags-and-custom-fields.md" },
    { "Config contexts"   = "features/config-contexts.md" },
