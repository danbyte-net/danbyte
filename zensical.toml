    { "External sync overview" = "features/external-sync.md" },
    { "Windows DHCP & DNS sync" = "features/windows-sync.md" },
  ] },
  { "Administration" = [
    "access/index.md",
    { "Permissions & access" = "features/permissions.md" },
    { "Single sign-on (SSO)" = "features/sso.md" },
    { "Site separation"   = "access/site-separation.md" },
  ] },
  { "Plugins" = "architecture/plugins.md" },
  { "Architecture" = [
    { "Overview"          = "architecture/overview.md" },
    { "Stack"             = "architecture/stack.md" },
    { "Data model"        = "architecture/data-model.md" },
    { "Isolation: Tenant + VRF" = "architecture/tenant-vrf.md" },
    { "Tenant settings & overrides" = "architecture/tenant-settings.md" },
    { "Fibre-strand internals" = "architecture/fiber-strands.md" },
    { "Service monitoring internals" = "architecture/service-monitoring.md" },
    { "Source-of-truth authoring audit" = "architecture/sot-authoring-gaps.md" },
    { "Design tokens"     = "architecture/shadcn-tokens.md" },
    { "Visual language"   = "design/visual-language.md" },
    { "Data models" = [
      { "Tenant"            = "models/tenant.md" },
      { "VRF"               = "models/vrf.md" },
      { "Site"              = "models/site.md" },
      { "VLAN"              = "models/vlan.md" },
      { "Prefix"            = "models/prefix.md" },
      { "IP address"        = "models/ip-address.md" },
      { "Tag"               = "models/tag.md" },
    ] },
  ] },
  { "Reference" = [
    { "REST API & OpenAPI" = "reference/api.md" },
    { "URL routes"        = "reference/url-routes.md" },
    { "Settings"          = "reference/settings.md" },
    { "Makefile"          = "reference/makefile.md" },
    { "Reverse proxy (nginx/443)" = "reference/nginx-proxy.md" },
    { "Icons"             = "reference/icons.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "navigation.instant",
  "navigation.tracking",
  # One collapsible LEFT sidebar (deliberately NO top tabs and NO
  # navigation.sections — categories stay collapsed until opened, so the menu is
  # short to scan). navigation.indexes makes a section's index page clickable.
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "search.suggest",
  "search.highlight",
  "search.share",
  "content.code.copy",
  "content.code.annotate",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "black"
accent  = "light-blue"
toggle  = { icon = "material/weather-night", name = "Switch to dark mode" }

[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent  = "light-blue"
toggle  = { icon = "material/weather-sunny", name = "Switch to light mode" }

# ───────────────────────────────────────────────────────────────────────────
# Markdown extensions
# ───────────────────────────────────────────────────────────────────────────

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index     = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums         = true
line_spans              = "__span"
pygments_lang_class     = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style       = true
combine_header_slug   = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]
