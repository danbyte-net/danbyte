{% if modules %}
{% with h=hx|default:"h2" %}
<section>
  <{{ h }}>Modules</{{ h }}>
  <table{% if tcls %} class="{{ tcls }}"{% endif %}>
    <thead><tr><th>Bay</th><th>Module type</th><th>Serial</th></tr></thead>
    <tbody>
    {% for m in modules %}<tr><td>{{ m.bay }}</td><td>{{ m.type }}</td><td class="mono">{{ m.serial }}</td></tr>{% endfor %}
    </tbody>
  </table>
</section>
{% endwith %}
{% endif %}
