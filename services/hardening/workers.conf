# Danbyte unit hardening: the RQ worker pool (#500).
#
# Linked as <unit>.d/10-hardening.conf by scripts/unit-hardening.sh. The
# workers run sandboxed scripts and the DWG converter inside bubblewrap,
# which needs user, mount and network namespaces of its own: no
# RestrictNamespaces=, and the system-call filter keeps what bwrap calls to
# build them (the mount calls, pivot_root, sethostname) and what Danbyte's
# own sandbox calls (Landlock, seccomp). bwrap is not setuid, so
# NoNewPrivileges= does not stop it; Danbyte sets no_new_privs before it
# starts bwrap anyway.
#
# No filesystem lines (ProtectSystem=, PrivateTmp=, ProtectHostname=,
# ProtectKernelTunables=): in a user unit each puts the process in a user
# namespace of systemd's, and on Ubuntu 24.04+ AppArmor then confines it to
# the unprivileged_userns profile, where bwrap cannot build its own.
# docs/getting-started/hardening.md#systemd-sandboxing
[Service]
NoNewPrivileges=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
SystemCallArchitectures=native
UMask=0027

RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SystemCallFilter=@system-service @mount @sandbox pivot_root sethostname
SystemCallErrorNumber=EPERM
