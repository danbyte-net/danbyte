# Danbyte unit hardening: web, websockets, frontend, docs, the fast lane and
# the periodic jobs (#500).
#
# Linked as <unit>.d/10-hardening.conf by scripts/unit-hardening.sh, with
# the unit's writable paths beside it in 20-hardening-paths.conf (made from
# this install's .env). None of these units starts bubblewrap, so they may
# not make namespaces of their own.
#
# The filesystem lines need a user namespace with mount rights. Where the
# host does not grant one (Ubuntu 24.04 and later restrict unprivileged user
# namespaces through AppArmor) systemd skips them without an error; the
# installer says which applies. docs/getting-started/hardening.md#systemd-sandboxing
[Service]
NoNewPrivileges=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
SystemCallArchitectures=native
UMask=0027

ProtectSystem=strict
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectHostname=yes

RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=yes
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
