# Danbyte unit hardening: the baseline (#500).
#
# Linked as <unit>.d/10-hardening.conf by scripts/unit-hardening.sh. Every
# app unit gets at least this; the code-writing units (auto-upgrade, ACME
# renewal) get only this, and so does a group whose own file fails to start
# on this host. Nothing here needs a user namespace: each line is a prctl or
# a seccomp filter, which a user manager can apply on every supported
# systemd. A drop-in of your own with a later name (50-local.conf) overrides
# any line; DANBYTE_UNIT_HARDENING=off in .env removes these files.
# docs/getting-started/hardening.md#systemd-sandboxing
[Service]
NoNewPrivileges=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
SystemCallArchitectures=native
UMask=0027
