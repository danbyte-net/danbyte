# nginx for the Docker/Podman stack. Reverse-proxies the SPA server (vite
# preview - the app is an SSR build, not static files), the Django backend
# (WSGI), WebSockets (daphne), and serves static/media off the shared volumes.
# Listens on both :80 and :443 (self-signed cert baked into the image) so
# browsers that force HTTPS still connect; terminate real TLS in front for
# production. Upstreams are compose service names.

upstream danbyte_spa     { server frontend:3000; }
upstream danbyte_backend { server backend:8000; }
upstream danbyte_ws      { server ws:8002; }

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    client_max_body_size 100m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Backup archives: multi-GB uploads and downloads, streamed.
    location /api/backups/ {
        proxy_pass http://danbyte_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 8g;
    }

    # Django-owned paths → gunicorn.
    location /api/ {
        proxy_pass http://danbyte_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://danbyte_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets → daphne (separate ASGI process; never in the HTTP path).
    location /ws/ {
        proxy_pass http://danbyte_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Collected static + uploaded media, straight off the shared volumes.
    location /static/ { alias /app/staticfiles/; access_log off; expires 7d; }
    location /media/  { alias /app/media/;       access_log off; }

    # "Danbyte is updating" page instead of a raw 502/503 - the backend is
    # down or a restore holds the site in maintenance.
    error_page 502 503 504 @danbyte_maintenance;
    location @danbyte_maintenance {
        root /usr/share/nginx/maintenance;
        rewrite ^ /maintenance.html break;
        internal;
        add_header Retry-After 30 always;
    }

    # Everything else → the SPA server (vite preview).
    location / {
        proxy_pass http://danbyte_spa;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
