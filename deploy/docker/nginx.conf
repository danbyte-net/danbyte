# nginx for the Docker/Podman stack. Reverse-proxies the SPA server (vite
# preview - the app is an SSR build, so its HTML is rendered there; only the
# hashed /assets/ are served from this image), the Django backend
# (WSGI), WebSockets (daphne), and serves static/media off the shared volumes.
# Listens on both :80 and :443 (self-signed cert baked into the image) so
# browsers that force HTTPS still connect; terminate real TLS in front for
# production. Upstreams are compose service names.

upstream danbyte_spa     { server frontend:3000; }
upstream danbyte_backend { server backend:8000; }
upstream danbyte_ws      { server ws:8002; }

# Hashed build files never change under their name: a year, immutable
# (#485). Empty elsewhere (nginx adds no header for an empty value), so it is
# set at the server level and every location keeps the security headers.
map $uri $danbyte_asset_cache {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "";
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    client_max_body_size 100m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    # Only /assets/ gets a value; not `always`, so a 404 is never cached.
    add_header Cache-Control $danbyte_asset_cache;
    # The backend sends its own copy of the headers above (#490); drop it so
    # each goes out once. HSTS stays the backend's (DANBYTE_HTTPS): this image
    # only has a self-signed certificate. A location with its own
    # proxy_hide_header must repeat these lines.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    # The frontend's hashed build files, copied into this image from the same
    # build as the frontend image, with the .gz the build writes beside each
    # (#485). Compression here covers only files on disk; dynamic responses
    # keep their current handling. A file this image lacks (the frontend
    # image rebuilt alone) still comes from the frontend server.
    location /assets/ {
        root /usr/share/nginx/frontend;
        try_files $uri @danbyte_frontend_assets;
        access_log off;
        gzip_static on;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm;
    }
    location @danbyte_frontend_assets {
        proxy_pass http://danbyte_spa;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Backup archives: multi-GB uploads and downloads, streamed.
    location /api/backups/ {
        proxy_pass http://danbyte_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Take the whole upload to disk before gunicorn sees it, and buffer
        # the whole download: a sync worker is killed after GUNICORN_TIMEOUT,
        # so a transfer running at the client's speed died after a minute
        # (#229). Needs free space for one archive in nginx's temp dir.
        proxy_request_buffering on;
        proxy_max_temp_file_size 10240m;
        proxy_read_timeout 600s;
        client_max_body_size 8g;
    }

    # Django-owned paths → gunicorn.
    location /api/ {
        proxy_pass http://danbyte_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://danbyte_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets → daphne (separate ASGI process; never in the HTTP path).
    location /ws/ {
        proxy_pass http://danbyte_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Collected static, straight off the shared volume. Uploaded media goes
    # through the backend, which checks who may see each private file (#227).
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    }
    location /media/ {
        proxy_pass http://danbyte_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Docs: the static Zensical site built into this image (#472). Directory
    # URLs resolve to index.html; a page without its trailing slash gets a
    # relative redirect so it keeps the /docs prefix and the client's host
    # and port (#123).
    location = /docs { absolute_redirect off; return 301 /docs/; }
    location /docs/ {
        alias /usr/share/nginx/docs/;
        index index.html;
        absolute_redirect off;
        try_files $uri $uri/ =404;
        expires 1h;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    }

    # "Danbyte is updating" page instead of a raw 502/503 - the backend is
    # down or a restore holds the site in maintenance.
    error_page 502 503 504 @danbyte_maintenance;
    location @danbyte_maintenance {
        root /usr/share/nginx/maintenance;
        rewrite ^ /maintenance.html break;
        internal;
        add_header Retry-After 30 always;
    }

    # Everything else → the SPA server (vite preview).
    location / {
        proxy_pass http://danbyte_spa;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
