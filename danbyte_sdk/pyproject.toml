[project]
name = "danbyte-sdk"
version = "0.1.0"
description = "What a Danbyte script imports - one API and report surface shared by sandboxed and trusted runs, standard library only."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
packages = ["danbyte_sdk"]
package-dir = { "danbyte_sdk" = "." }
