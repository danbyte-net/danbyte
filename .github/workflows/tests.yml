name: Tests

# The release test gate: the full backend suite, the migration and schema
# checks, and the frontend build, typecheck and unit tests. Called by
# release.yml on a version tag and by container.yml on a manual dispatch, so
# the job is defined once and nothing publishes from an untested commit.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (backend suite + frontend build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_DB: danbyte
          POSTGRES_USER: danbyte
          POSTGRES_PASSWORD: danbyte
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U danbyte"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: public.ecr.aws/docker/library/redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: danbyte
      DB_USER: danbyte
      DB_PASSWORD: danbyte
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      DJANGO_SECRET_KEY: ci-not-a-real-secret
      DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: System deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome* || true
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y build-essential libldap2-dev libsasl2-dev
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Migrations + undefined-name gate
        run: |
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
          ruff check --select F821 .
      - name: OpenAPI schema generates cleanly
        # The committed openapi.yaml (repo root) is the source of truth the API
        # reference site tracks; prove the schema still builds with no errors.
        run: python manage.py spectacular --file /tmp/openapi.yaml --validate
      - name: Backend test suite
        run: python manage.py test --noinput
      - name: Frontend build + typecheck + unit tests
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm run test
