name: CI

on:
  pull_request:
  push:
    branches: [main, 'dev/**']

# Every job only checks out and builds; none writes back to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full gate - sharded backend suite, migration/schema checks and the
  # frontend build/typecheck/unit tests - exactly as a release runs it, so a
  # failure shows up when the change lands, not on release day.
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff
      - name: Ruff (advisory - not yet a gate; F821 is gated in tests.yml)
        continue-on-error: true
        run: ruff check .
      # The upgrade launchers and stage run under /bin/sh (dash on Debian and
      # Ubuntu). core.tests_upgrade_scripts runs them for real.
      - name: ShellCheck upgrade scripts (advisory)
        continue-on-error: true
        run: shellcheck -x -s sh scripts/upgrade/*.sh scripts/danbyte-upgrade.sh scripts/danbyte-upgrade-bundle.sh

  # The database of the last final release, upgraded the way the upgrade
  # stage does it: every pending migration in one transaction, then the
  # same verify the stage runs before any service starts.
  upgrade-rehearsal:
    name: Upgrade migration rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_DB: danbyte
          POSTGRES_USER: danbyte
          POSTGRES_PASSWORD: danbyte
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U danbyte"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: mirror.gcr.io/library/redis:7
        ports: ['6379:6379']
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: danbyte
      DB_USER: danbyte
      DB_PASSWORD: danbyte
      REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_SECRET_KEY: ci-not-a-real-secret
      DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: System deps (python-ldap build headers)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome* || true
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y build-essential libldap2-dev libsasl2-dev
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
      - name: Migrate to the last final release, then upgrade
        run: |
          # the newest final release this one is built on
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD^)
          echo "rehearsing the upgrade from $prev"
          python scripts/upgrade/rehearse_migrations.py "$prev"
          python manage.py upgrade_migrate --plan
          python manage.py upgrade_migrate
          python manage.py upgrade_verify

  frontend:
    name: Frontend lint (advisory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Build first - it regenerates the TanStack routeTree that ESLint reads.
      - name: Build
        run: npm run build
      - name: Prettier (advisory)
        continue-on-error: true
        run: npm run check
      - name: ESLint (advisory - large pre-existing baseline)
        continue-on-error: true
        run: npm run lint
